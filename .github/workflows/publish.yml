name: publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional release note"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: List artefacts
        run: ls -la dist/

      - name: Check metadata
        run: twine check dist/*

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/loop-memory
    # Trusted publishing: no API token required; PyPI must have this
    # workflow registered under the project's "Publishing" settings.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Warm shields.io badge cache
        # shields.io caches PyPI badges for up to ~15 minutes after a new
        # release, during which the README flashes "package or version
        # not found" on the freshly published version. Hit each badge we
        # use in README.md so the GitHub Release page renders cleanly the
        # first time someone opens it. Soft step: shields outage is OK.
        run: |
          set +e
          for url in \
            "https://img.shields.io/pypi/v/loop-memory" \
            "https://img.shields.io/pypi/pyversions/loop-memory" \
            "https://img.shields.io/pypi/status/loop-memory" \
            "https://img.shields.io/pypi/dm/loop-memory" \
            "https://img.shields.io/pypi/format/loop-memory"
          do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' -m 15 "$url" || echo 000)
            echo "  warmed $(basename "$url") -> HTTP $code"
          done
          echo "shields.io caches warmed"

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
